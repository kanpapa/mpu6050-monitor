<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UNO Q + MPU6050 IMU Monitor</title>
<style>
  :root {
    --bg:#0f1117; --surface:#1c1f2a; --border:#2e3244;
    --accent:#4fa3e0; --text:#e2e8f0; --muted:#8892a4;
    --green:#22c55e; --red:#ef4444; --amber:#f5a623; --radius:10px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,'Segoe UI',sans-serif; background:var(--bg);
         color:var(--text); padding:1rem; }
  main { max-width:720px; margin:0 auto; display:flex;
         flex-direction:column; gap:1.25rem; }
  header { display:flex; flex-direction:column; align-items:center;
           gap:.5rem; margin-bottom:1rem; text-align:center; }
  h1 { font-size:1.3rem; }
  .status { font-size:.75rem; font-weight:600; padding:.25rem .75rem;
            border-radius:999px; text-transform:uppercase; }
  .status.connected    { background:var(--green); color:#fff; }
  .status.disconnected { background:var(--red);   color:#fff; }
  .status.connecting   { background:var(--muted); color:#fff; }
  .status.stale        { background:var(--amber); color:#000; }
  .card { background:var(--surface); border:1px solid var(--border);
          border-radius:var(--radius); padding:1.25rem 1.5rem; }
  .card h2 { font-size:.85rem; font-weight:600; color:var(--muted);
             text-transform:uppercase; letter-spacing:.06em;
             margin-bottom:1rem; }
  .axis { margin-bottom:1.1rem; }
  .axis-head { display:flex; justify-content:space-between;
               align-items:baseline; margin-bottom:.35rem; }
  .axis-name { font-size:.8rem; color:var(--muted); }
  .axis-val  { font-variant-numeric:tabular-nums; font-weight:700;
               font-size:1.15rem; }
  .bar { position:relative; height:10px; background:var(--bg);
         border:1px solid var(--border); border-radius:999px; }
  .bar::before { content:""; position:absolute; left:50%; top:-3px;
                 bottom:-3px; width:1px; background:var(--border); }
  .fill { position:absolute; top:0; bottom:0; background:var(--accent);
          border-radius:999px; transition:left .08s linear, width .08s linear; }
  .fill.yaw { background:var(--amber); }
  .meta { display:flex; gap:1.5rem; flex-wrap:wrap;
          font-size:.8rem; color:var(--muted); }
  .meta b { color:var(--text); font-variant-numeric:tabular-nums; }
  .actions { display:flex; gap:.75rem; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:none;
           border-radius:8px; padding:.55rem 1.1rem; font-size:.85rem;
           font-weight:600; cursor:pointer; }
  button:hover { opacity:.85; }
  button.secondary { background:var(--border); }
  #log { font-family:ui-monospace,monospace; font-size:.75rem;
         color:var(--muted); background:var(--bg); border:1px solid var(--border);
         border-radius:8px; padding:.75rem; height:120px; overflow-y:auto;
         white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>UNO Q + MPU6050 IMU Monitor</h1>
    <span id="status" class="status connecting">Connecting…</span>
  </header>

  <section class="card">
    <h2>Attitude</h2>

    <div class="axis">
      <div class="axis-head">
        <span class="axis-name">Roll</span>
        <span class="axis-val" id="v-roll">--</span>
      </div>
      <div class="bar"><div class="fill" id="b-roll"></div></div>
    </div>

    <div class="axis">
      <div class="axis-head">
        <span class="axis-name">Pitch</span>
        <span class="axis-val" id="v-pitch">--</span>
      </div>
      <div class="bar"><div class="fill" id="b-pitch"></div></div>
    </div>

    <div class="axis">
      <div class="axis-head">
        <span class="axis-name">Yaw <small>(相対値・ドリフトあり)</small></span>
        <span class="axis-val" id="v-yaw">--</span>
      </div>
      <div class="bar"><div class="fill yaw" id="b-yaw"></div></div>
    </div>

    <div class="meta">
      <span>Temp <b id="v-temp">--</b> °C</span>
      <span>Rate <b id="v-hz">--</b> Hz</span>
    </div>
  </section>
  
<section class="card">
  <h2>3D Attitude</h2>
  <div class="scene3d">
    <div class="board3d" id="board3d">
      <div class="face top">
        <span class="board-label">UNO Q</span>
        <span class="board-nose">▲ FRONT</span>
      </div>
      <div class="face bottom"></div>
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face left"></div>
      <div class="face right"></div>
    </div>
  </div>
</section>
  
  <section class="card">
    <h2>Control</h2>
    <div class="actions">
      <button id="btn-cal">ジャイロ キャリブレーション</button>
      <button id="btn-yaw" class="secondary">yaw リセット</button>
      <button id="btn-raw" class="secondary">生値を読む</button>
    </div>
  </section>

  <section class="card">
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
